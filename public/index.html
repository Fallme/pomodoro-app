<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>番茄钟</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>番茄钟</h1>
    </header>

    <!-- ═══ Timer Tab ═══ -->
    <section id="tab-timer" class="tab-content active">
      <div class="timer-wrap">
        <div class="timer-ring-wrap">
          <svg viewBox="0 0 260 260" width="100%" height="100%">
            <defs>
              <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#FF8C6B"/>
                <stop offset="100%" style="stop-color:#FFB5A0"/>
              </linearGradient>
            </defs>
            <circle class="timer-ring-bg" cx="130" cy="130" r="115"/>
            <circle id="ring-progress" class="timer-ring-progress" cx="130" cy="130" r="115"
              stroke-dasharray="722.57" stroke-dashoffset="0"/>
          </svg>
          <div class="timer-center">
            <div id="timer-phase" class="timer-phase">专注</div>
            <div id="timer-time" class="timer-time">25:00</div>
            <div id="timer-cycle" class="timer-cycle">1 / 4</div>
          </div>
        </div>

        <!-- Task selector -->
        <div id="timer-task-bar" class="timer-task-bar">
          <div class="task-icon">
            <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          </div>
          <span id="timer-task-label" class="task-label">选择任务</span>
          <svg class="task-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </div>

        <!-- Controls -->
        <div class="timer-controls">
          <button id="btn-reset" class="ctrl-btn secondary" title="重置">
            <svg viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
          </button>
          <button id="btn-start" class="ctrl-btn primary" title="开始">
            <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
          </button>
          <button id="btn-skip" class="ctrl-btn secondary" title="跳过">
            <svg viewBox="0 0 24 24"><polygon points="5,4 15,12 5,20"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          </button>
        </div>

        <!-- Settings toggle -->
        <div id="settings-toggle" class="settings-toggle">
          <div class="st-left">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            计时设置
          </div>
          <svg class="st-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div id="settings-panel" class="settings-panel">
          <div class="settings-inner">
            <div class="setting-row">
              <span class="setting-label">专注时长</span>
              <div class="setting-stepper">
                <button data-setting="focus" data-dir="-1">−</button>
                <span class="val" id="s-focus">25</span>
                <span class="unit">分钟</span>
                <button data-setting="focus" data-dir="1">+</button>
              </div>
            </div>
            <div class="setting-row">
              <span class="setting-label">短休息</span>
              <div class="setting-stepper">
                <button data-setting="short" data-dir="-1">−</button>
                <span class="val" id="s-short">5</span>
                <span class="unit">分钟</span>
                <button data-setting="short" data-dir="1">+</button>
              </div>
            </div>
            <div class="setting-row">
              <span class="setting-label">长休息</span>
              <div class="setting-stepper">
                <button data-setting="long" data-dir="-1">−</button>
                <span class="val" id="s-long">15</span>
                <span class="unit">分钟</span>
                <button data-setting="long" data-dir="1">+</button>
              </div>
            </div>
            <div class="setting-row">
              <span class="setting-label">循环次数</span>
              <div class="setting-stepper">
                <button data-setting="cycles" data-dir="-1">−</button>
                <span class="val" id="s-cycles">4</span>
                <span class="unit">次</span>
                <button data-setting="cycles" data-dir="1">+</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══ TODO Tab ═══ -->
    <section id="tab-todo" class="tab-content">
      <div class="todo-section">
        <div class="todo-input-wrap glass">
          <input id="task-input" class="todo-input" type="text" placeholder="添加新任务..." maxlength="100">
          <select id="task-priority" class="todo-priority">
            <option value="1">P1</option>
            <option value="2">P2</option>
            <option value="3" selected>P3</option>
            <option value="4">P4</option>
            <option value="5">P5</option>
          </select>
          <button id="task-add-btn" class="todo-add-btn">+</button>
        </div>
        <div class="todo-filters">
          <button class="filter-chip active" data-filter="all">全部</button>
          <button class="filter-chip" data-filter="waiting">等待</button>
          <button class="filter-chip" data-filter="in_progress">进行中</button>
          <button class="filter-chip" data-filter="completed">完成</button>
          <button class="filter-chip" data-filter="abandoned">废弃</button>
        </div>
        <div id="task-list" class="task-list"></div>
      </div>
    </section>

    <!-- ═══ Stats Tab ═══ -->
    <section id="tab-stats" class="tab-content">
      <div class="stats-section">
        <!-- Hero -->
        <div class="stats-hero glass">
          <div class="stats-hero-value" id="stat-today">0</div>
          <div class="stats-hero-label">今日专注分钟</div>
          <div class="stats-hero-sub">
            <div class="sub-item">
              <div class="sub-val" id="stat-today-count">0</div>
              <div class="sub-label">番茄</div>
            </div>
            <div class="sub-item">
              <div class="sub-val" id="stat-streak">0</div>
              <div class="sub-label">连续天数</div>
            </div>
            <div class="sub-item">
              <div class="sub-val" id="stat-total">0</div>
              <div class="sub-label">累计分钟</div>
            </div>
          </div>
        </div>

        <!-- Task stats cards -->
        <div class="stats-cards">
          <div class="stat-card glass">
            <div class="sc-val" id="stat-task-total">0</div>
            <div class="sc-label">总任务数</div>
          </div>
          <div class="stat-card glass">
            <div class="sc-val" id="stat-task-done">0</div>
            <div class="sc-label">已完成</div>
          </div>
          <div class="stat-card glass">
            <div class="sc-val" id="stat-task-rate">0%</div>
            <div class="sc-label">完成率</div>
          </div>
          <div class="stat-card glass">
            <div class="sc-val" id="stat-task-progress">0</div>
            <div class="sc-label">进行中</div>
          </div>
        </div>

        <!-- Pie chart: daily task breakdown -->
        <div class="chart-section glass">
          <div class="chart-title">今日任务分布</div>
          <div id="pie-area">
            <canvas id="pie-chart" class="pie-canvas"></canvas>
            <div id="pie-legend" class="pie-legend"></div>
          </div>
          <div id="daily-task-list" class="daily-task-list"></div>
        </div>

        <!-- Weekly bar chart -->
        <div class="chart-section glass">
          <div class="chart-title">本周趋势</div>
          <canvas id="weekly-chart" class="chart-canvas"></canvas>
        </div>

        <!-- Heatmap -->
        <div class="chart-section glass">
          <div class="chart-title">打卡日历</div>
          <div class="heatmap-scroll">
            <canvas id="heatmap-chart" class="chart-canvas" style="height:140px;min-width:400px"></canvas>
          </div>
        </div>

        <!-- Monthly trend -->
        <div class="chart-section glass">
          <div class="chart-title">月度趋势</div>
          <canvas id="monthly-chart" class="chart-canvas"></canvas>
        </div>

        <!-- History day view -->
        <div class="chart-section glass" id="history-section" style="display:none">
          <div class="chart-title">
            <span id="history-date-label">历史查看</span>
            <input type="date" id="history-date-picker" class="history-date-picker">
          </div>
          <div id="history-pie-area">
            <canvas id="history-pie" class="pie-canvas"></canvas>
            <div id="history-pie-legend" class="pie-legend"></div>
          </div>
          <div id="history-task-list" class="daily-task-list"></div>
        </div>
      </div>
    </section>

    <!-- ═══ Task Picker Bottom Sheet ═══ -->
    <div id="sheet-overlay" class="sheet-overlay"></div>
    <div id="task-sheet" class="task-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">选择任务</div>
      <div id="sheet-options"></div>
    </div>

    <!-- ═══ Task Edit Bottom Sheet ═══ -->
    <div id="edit-sheet" class="task-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">编辑任务</div>
      <div class="edit-sheet-inner">
        <div class="edit-field">
          <label class="edit-label">任务名称</label>
          <input id="edit-title" class="todo-input" type="text" maxlength="100" style="width:100%">
        </div>
        <div class="edit-field">
          <label class="edit-label">优先级</label>
          <div class="edit-priority-row" id="edit-priority-row">
            <button class="ep-btn" data-p="1">P1</button>
            <button class="ep-btn" data-p="2">P2</button>
            <button class="ep-btn" data-p="3">P3</button>
            <button class="ep-btn" data-p="4">P4</button>
            <button class="ep-btn" data-p="5">P5</button>
          </div>
        </div>
        <div class="edit-field">
          <label class="edit-label">状态</label>
          <div class="edit-priority-row" id="edit-state-row">
            <button class="es-btn" data-state="waiting">等待</button>
            <button class="es-btn" data-state="in_progress">进行</button>
            <button class="es-btn" data-state="completed">完成</button>
            <button class="es-btn" data-state="abandoned">废弃</button>
          </div>
        </div>
        <button id="edit-save-btn" class="edit-save-btn">保存</button>
      </div>
    </div>
  </div>

  <!-- ═══ Bottom Tab Bar ═══ -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="timer">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>专注</span>
    </button>
    <button class="tab-btn" data-tab="todo">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      <span>清单</span>
    </button>
    <button class="tab-btn" data-tab="stats">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>统计</span>
    </button>
  </nav>

  <!-- ═══ Toast Notification ═══ -->
  <div id="toast" class="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/todo.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
